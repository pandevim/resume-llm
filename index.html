<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat with my resume – ask questions, get insights, and explore my background interactively.">
    <title>Chat with my Resume</title>
    <link href="https://fonts.googleapis.com/css2?family=Berkeley+Mono:ital,wght@0,100..700;1,100..700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
    <style>
        :root {
            --bg: #f5f0eb;
            --surface: #faf8f5;
            --border: #e0d9d0;
            --accent: #c0392b;
            --accent-dim: rgba(192, 57, 43, 0.12);
            --text: #1a1a1a;
            --text-muted: #888;
            --text-faint: #bbb;
            --mono: 'Berkeley Mono', 'Fira Mono', 'Courier New', monospace;
            --sans: 'Inter', system-ui, sans-serif;
            --radius: 8px;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Top Bar ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            height: 44px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            user-select: none;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .app-title {
            font-family: var(--mono);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text);
        }

        .topbar-tag {
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--text-muted);
            padding: 2px 7px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            animation: pulse 2s infinite;
        }

        .status-dot.idle { background: #aaa; animation: none; }
        .status-dot.thinking { background: #f39c12; animation: pulse 0.8s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Layout ── */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 420px;
            overflow: hidden;
        }

        /* ── PDF Preview Pane ── */
        .pdf-pane {
            display: flex;
            flex-direction: column;
            background: #4a4a4a;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }

        .pdf-pane::-webkit-scrollbar { width: 6px; }
        .pdf-pane::-webkit-scrollbar-track { background: #3a3a3a; }
        .pdf-pane::-webkit-scrollbar-thumb { background: #666; border-radius: 3px; }

        .pdf-canvas-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 0;
        }

        .pdf-canvas-wrapper canvas {
            display: block;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
            background: #fff;
        }

        .pdf-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-family: var(--mono);
            font-size: 0.78rem;
            color: #999;
        }

        /* ── Chat Pane ── */
        .chat-pane {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* Welcome state */
        .welcome-state {
            margin: auto;
            text-align: center;
            pointer-events: none;
        }

        .welcome-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            opacity: 0.7;
        }

        .welcome-state h2 {
            font-family: var(--mono);
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: var(--text);
        }

        .welcome-state p {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.7;
        }

        /* Chat messages */
        .msg {
            display: flex;
            flex-direction: column;
            max-width: 88%;
            animation: fadeUp 0.25s ease forwards;
        }

        .msg.user { align-self: flex-end; }
        .msg.bot { align-self: flex-start; }

        .msg-bubble {
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            font-size: 0.88rem;
            line-height: 1.55;
        }

        .msg.user .msg-bubble {
            background: var(--text);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .msg.bot .msg-bubble {
            background: #eee9e3;
            color: var(--text);
            border-bottom-left-radius: 2px;
            font-family: var(--mono);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typing indicator */
        .typing-bubble {
            display: flex;
            gap: 4px;
            padding: 0.75rem 1rem;
            background: #eee9e3;
            border-radius: var(--radius);
            border-bottom-left-radius: 2px;
            align-self: flex-start;
            width: fit-content;
        }

        .t-dot {
            width: 5px;
            height: 5px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .t-dot:nth-child(2) { animation-delay: 0.15s; }
        .t-dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
        }

        /* Suggested questions */
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0 1.25rem 1rem;
        }

        .suggestion-btn {
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--text-muted);
            background: none;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .suggestion-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        /* Chat input */
        .chat-input-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            border-top: 1px solid var(--border);
            background: var(--surface);
        }

        .chat-input {
            flex: 1;
            font-family: var(--mono);
            font-size: 0.82rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.6rem 0.9rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input::placeholder { color: var(--text-faint); }
        .chat-input:focus { border-color: var(--accent); }

        .send-btn {
            background: var(--text);
            color: #fff;
            border: none;
            border-radius: 6px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) { opacity: 0.8; transform: translateY(-1px); }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .send-btn svg { width: 16px; height: 16px; }

        /* ── Bottom Status Bar ── */
        .statusbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            height: 36px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .statusbar-left {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .statusbar-left span { display: flex; align-items: center; gap: 0.35rem; }
        .statusbar-left .sep { color: var(--border); }

        .statusbar-right {
            font-family: var(--mono);
            font-size: 0.68rem;
            color: var(--text-faint);
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: 40% 1fr;
            }
            .pdf-pane {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }
    </style>
</head>
<body>

    <!-- Top bar -->
    <header class="topbar">
        <div class="topbar-left">
            <span class="app-title">Chat with my Resume</span>
            <span class="topbar-tag">ternary · v0.3.1</span>
        </div>
        <div class="topbar-right">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">ready</span>
            <span>·</span>
            <span id="model-label">ternary 3.1M</span>
        </div>
    </header>

    <!-- Main split -->
    <div class="workspace">

        <!-- Left: PDF preview -->
        <div class="pdf-pane" id="pdf-pane">
            <div class="pdf-loading" id="pdf-loading">loading pdf…</div>
            <div class="pdf-canvas-wrapper" id="pdf-canvas-wrapper"></div>
        </div>

        <!-- Right: Chat -->
        <div class="chat-pane">
            <div class="chat-messages" id="chat-messages">
                <div class="welcome-state" id="welcome-state">
                    <div class="welcome-icon">💬</div>
                    <h2>resume loaded</h2>
                    <p>// ternary weights ready<br>// ask me anything about my background</p>
                </div>
            </div>

            <!-- Suggested questions -->
            <div class="suggestions" id="suggestions">
                <button type="button" class="suggestion-btn" data-q="What's your background?">What's your background?</button>
                <button type="button" class="suggestion-btn" data-q="Tell me about a project you're proud of.">Tell me about a project you're proud of.</button>
                <button type="button" class="suggestion-btn" data-q="Do you have PDF experience?">Do you have PDF experience?</button>
                <button type="button" class="suggestion-btn" data-q="What are you working on now?">What are you working on now?</button>
            </div>

            <!-- Input -->
            <form class="chat-input-row" id="chat-form">
                <input
                    type="text"
                    class="chat-input"
                    id="chat-input"
                    placeholder="ask anything…"
                    autocomplete="off"
                >
                <button type="submit" class="send-btn" id="send-btn" aria-label="Send">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Bottom status bar -->
    <footer class="statusbar">
        <div class="statusbar-left">
            <span id="file-stat">resume.pdf</span>
            <span class="sep">|</span>
            <span id="attention-stat">attention idle</span>
        </div>
        <div class="statusbar-right">
            <span>polyglot pdf · self-contained</span>
        </div>
    </footer>

<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';

(async function () {
    'use strict';

    // ── PDF.js setup
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    const pdfPane = document.getElementById('pdf-pane');
    const pdfLoading = document.getElementById('pdf-loading');
    const pdfCanvasWrapper = document.getElementById('pdf-canvas-wrapper');

    // Load and render all PDF pages
    try {
        const pdf = await pdfjsLib.getDocument('/dist/resume.pdf').promise;
        pdfLoading.style.display = 'none';

        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const paneWidth = pdfPane.clientWidth - 32; // 16px padding each side
            const unscaledViewport = page.getViewport({ scale: 1 });
            const scale = paneWidth / unscaledViewport.width;
            const viewport = page.getViewport({ scale: scale * (window.devicePixelRatio || 1) });

            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            canvas.style.width = paneWidth + 'px';
            canvas.style.height = (paneWidth * unscaledViewport.height / unscaledViewport.width) + 'px';
            pdfCanvasWrapper.appendChild(canvas);

            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        }

        // Update page stat
        document.getElementById('attention-stat').previousElementSibling.previousElementSibling.textContent = pdf.numPages + (pdf.numPages === 1 ? ' page' : ' pages');
    } catch (err) {
        pdfLoading.textContent = 'failed to load pdf';
        console.error('PDF load error:', err);
    }

    // ── Elements
    const chatMessages = document.getElementById('chat-messages');
    const welcomeState = document.getElementById('welcome-state');
    const suggestions = document.getElementById('suggestions');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const attentionStat = document.getElementById('attention-stat');

    // Focus input on load
    chatInput.focus();

    function setStatus(state, text) {
        statusDot.className = 'status-dot ' + (state || '');
        statusText.textContent = text;
    }

    // ── Suggestions
    suggestions.querySelectorAll('.suggestion-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            chatInput.value = btn.dataset.q;
            sendMessage();
        });
    });

    // ── Chat form
    chatForm.addEventListener('submit', e => {
        e.preventDefault();
        sendMessage();
    });

    async function sendMessage() {
        const msg = chatInput.value.trim();
        if (!msg) return;

        // Hide welcome + suggestions on first message
        if (welcomeState) welcomeState.style.display = 'none';
        suggestions.style.display = 'none';

        addMsg('user', msg);
        chatInput.value = '';
        chatInput.disabled = true;
        sendBtn.disabled = true;
        setStatus('thinking', 'thinking');
        attentionStat.textContent = 'attention active';

        const indicator = showTyping();

        const formData = new FormData();
        formData.append('message', msg);

        try {
            const res = await fetch('/api/chat', { method: 'POST', body: formData });
            removeTyping(indicator);

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.detail || `Server error ${res.status}`);
            }

            const data = await res.json();
            addMsg('bot', data.response || '(no response)');
        } catch (err) {
            removeTyping(indicator);
            addMsg('bot', `error: ${err.message}`);
        } finally {
            chatInput.disabled = false;
            sendBtn.disabled = false;
            setStatus('', 'ready');
            attentionStat.textContent = 'attention idle';
            chatInput.focus();
        }
    }

    function addMsg(role, text) {
        const wrapper = document.createElement('div');
        wrapper.className = `msg ${role}`;

        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        bubble.textContent = text;

        wrapper.appendChild(bubble);
        chatMessages.appendChild(wrapper);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
        const el = document.createElement('div');
        el.className = 'typing-bubble';
        el.innerHTML = '<div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div>';
        chatMessages.appendChild(el);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return el;
    }

    function removeTyping(el) {
        if (el && el.parentNode) el.parentNode.removeChild(el);
    }
})();
</script>
</body>
</html>
